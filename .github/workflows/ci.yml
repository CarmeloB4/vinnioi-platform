name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Scenario storico sintetico (nessuna fonte reale)
        run: uv run python scripts/demo_history.py
      - name: Integrazione sintetica e verifica backup/restore locali
        run: uv run python scripts/demo_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-quality-report
          path: |
            data/demo-synthetic/summary.json
            data/demo-integration/summary.json
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:web
      - run: npm run build
      - name: Browser Chromium per test locali della build statica
        run: npm exec -w apps/web -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-verification
          path: |
            apps/web/test-results/
            docs/screenshots/phase4-*.png
          if-no-files-found: warn
