[project]
name = "vinnioi"
version = "0.3.0"
description = "Pipeline dell'osservatorio civico idrico agrigentino"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "pymupdf>=1.26,<2",
    "pydantic>=2.11,<3",
    "polars>=1.30,<2",
    "duckdb>=1.3,<2",
    "pytz>=2025.2",
]

[project.scripts]
vinnioi = "vinnioi.cli:main"
vinnioi-history = "vinnioi.history_cli:main"
vinnioi-integrate = "vinnioi.integration_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/ingestion/src/vinnioi"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
